<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Your Music — Offline</title>
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#ff4b3e">
</head>
<body>
  <div class="offline-wrap">
    <svg viewBox="0 0 32 32" fill="none" style="width:64px;height:64px;margin-bottom:20px">
      <rect width="32" height="32" rx="8" fill="rgba(255,75,62,0.1)"/>
      <path d="M16 6L26 11V21L16 26L6 21V11L16 6Z" stroke="#ff4b3e" stroke-width="1.5" fill="none"/>
      <circle cx="16" cy="16" r="3.5" fill="#ff4b3e"/>
    </svg>
    <h1 style="font-size:1.4rem;font-weight:700;margin-bottom:8px;">Du är offline</h1>
    <p style="color:var(--muted);margin-bottom:24px;max-width:300px;">Ingen internetanslutning just nu. Kontrollera din uppkoppling och försök igen.</p>
    <button class="btn" onclick="window.location.reload()">Försök igen</button>
    <p style="margin-top:16px;font-size:0.75rem;color:var(--muted);">Share Your Music · feedback-utbyte</p>
  </div>
</body>
</html>
