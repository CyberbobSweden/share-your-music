<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Your Music — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#E8462A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ShareMusic">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/icon-16.png">
<link rel="shortcut icon" href="/favicon.ico">
</head>
<body>
  <div class="auth-page">
    <div class="auth-hero">
      <img src="/assets/hero.png" alt="A tilted cassette tape, the Share Your Music mascot" width="420" height="420">
    </div>
    <div class="auth-card">
      <div class="label"><span class="eq-icon"><i></i><i></i><i></i><i></i></span>Share Your Music</div>
      <h1>Step into the studio</h1>
      <p class="section-sub">Upload a track. Get honest feedback.<br>Give feedback. Earn listens.</p>

      <div class="tabs-auth">
        <button class="tab-btn active" id="tabBtnLogin" onclick="switchAuthTab('login')">Sign In</button>
        <button class="tab-btn" id="tabBtnRegister" onclick="switchAuthTab('register')">Register</button>
      </div>

      <div class="tab-panel active" id="tabLogin">
        <div class="alert error" id="login-alert"></div>
        <div class="field"><label>Email</label><input type="email" id="login-email" autocomplete="email"></div>
        <div class="field"><label>Password</label><input type="password" id="login-password" autocomplete="current-password"></div>
        <button class="btn full" id="login-btn">Sign In</button>
      </div>

      <div class="tab-panel" id="tabRegister">
        <div class="alert error" id="reg-alert"></div>
        <div class="alert success" id="reg-success"></div>
        <div class="field"><label>Artist name</label><input type="text" id="reg-username" autocomplete="username" placeholder="e.g. Midnight Static"></div>
        <div class="field"><label>Email</label><input type="email" id="reg-email" autocomplete="email"></div>
        <div class="field"><label>Password <span class="hint">(min. 8 characters)</span></label><input type="password" id="reg-password" autocomplete="new-password"></div>
        <button class="btn full" id="reg-btn">Create Account</button>
        <p class="hint" style="text-align:center;margin-top:12px;">By registering you agree to give honest feedback. 🎧</p>
      </div>
      <div style="text-align:center;margin-top:20px;">
        <a href="/about.html" class="hint">Why this exists →</a><br>
        <span class="hint" id="versionFooter"></span>
      </div>
    </div>
  </div>

  <script src="/assets/app.js"></script>
  <script>
    redirectIfAuthed();

    function switchAuthTab(tab){
      document.getElementById('tabBtnLogin').classList.toggle('active', tab==='login');
      document.getElementById('tabBtnRegister').classList.toggle('active', tab==='register');
      document.getElementById('tabLogin').classList.toggle('active', tab==='login');
      document.getElementById('tabRegister').classList.toggle('active', tab==='register');
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      const btn = document.getElementById('login-btn');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      hideAlert('login-alert');
      if(!email || !password) return showAlert('login-alert','Enter your email and password.');
      setLoading(btn, true);
      const res = await apiFetch('/auth/login', { method:'POST', body: JSON.stringify({ email, password }) });
      setLoading(btn, false);
      if(!res) return;
      if(!res.ok) return showAlert('login-alert', res.data?.error || 'Wrong email or password.');
      setAuth(res.data.token, res.data.user);
      window.location.href = '/app.html';
    });
    document.getElementById('login-password').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('login-btn').click(); });

    document.getElementById('reg-btn').addEventListener('click', async () => {
      const btn = document.getElementById('reg-btn');
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      hideAlert('reg-alert'); hideAlert('reg-success');
      if(!username || !email || !password) return showAlert('reg-alert','Fill in all fields.');
      setLoading(btn, true);
      const res = await apiFetch('/auth/register', { method:'POST', body: JSON.stringify({ username, email, password }) });
      setLoading(btn, false);
      if(!res) return;
      if(!res.ok) return showAlert('reg-alert', res.data?.error || 'Registration failed.');
      showAlert('reg-success','Account created! Signing you in...','success');
      setAuth(res.data.token, res.data.user);
      setTimeout(() => window.location.href = '/app.html', 700);
    });
  </script>
</body>
</html>
