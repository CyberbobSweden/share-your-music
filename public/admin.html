<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Your Music — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/style.css">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#ff4b3e">
<style>
  .amount-input{width:56px;background:var(--panel-2);border:1px solid var(--line);color:var(--text);padding:5px 6px;font-family:var(--mono);font-size:12px;border-radius:3px;text-align:center;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="brand">
      <h1><span class="eq-icon"><i></i><i></i><i></i><i></i></span>Share Your Music</h1>
      <div class="nav-links" style="margin-top:6px;"><a href="/app.html">← Back to app</a></div>
    </div>
    <div class="user-panel">
      <div>
        <div class="user-name" id="userNameDisplay"></div>
        <button class="switch-link" onclick="logout()">sign out</button>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:24px;">
    <h3 class="section-title">🛡️ Admin panel</h3>
    <p class="section-sub">Adjust credits, ban or reinstate users.</p>

    <div class="stats-grid" id="statsGrid" style="margin-bottom:20px;">
      <div class="stat-card"><div class="stat-label">Users</div><div class="stat-value" id="sUsers">—</div></div>
      <div class="stat-card"><div class="stat-label">Banned</div><div class="stat-value red" id="sBanned">—</div></div>
      <div class="stat-card"><div class="stat-label">Admins</div><div class="stat-value gold" id="sAdmins">—</div></div>
    </div>

    <div class="field"><input type="text" id="userSearch" placeholder="Search users..." oninput="renderUsers()"></div>
    <div id="adminList"></div>
  </div>

  <div class="panel" style="margin-top:16px;">
    <h3 class="section-title">💡 Suggestions</h3>
    <p class="section-sub">Sent in by members via the Suggest tab.</p>
    <div id="suggestionsList"></div>
  </div>
  <div style="text-align:center;padding:16px 0;"><span class="hint" id="versionFooter"></span></div>
</div>

<script src="/assets/app.js"></script>
<script>
const auth = requireAuthOrRedirect();
let allUsers = [];

async function init(){
  if(!auth) return;
  const profRes = await apiFetch('/profile');
  if(!profRes || !profRes.ok) return;
  if(!profRes.data.user.is_admin){
    window.location.href = '/app.html';
    return;
  }
  document.getElementById('userNameDisplay').textContent = profRes.data.user.username;
  await loadUsers();
  await loadSuggestions();
}

async function loadUsers(){
  const res = await apiFetch('/admin/users');
  if(!res || !res.ok){
    document.getElementById('adminList').innerHTML = '<div class="empty-state">Could not load users. Are you signed in as an admin?</div>';
    return;
  }
  allUsers = res.data.users || [];
  document.getElementById('sUsers').textContent = allUsers.length;
  document.getElementById('sBanned').textContent = allUsers.filter(u=>u.is_banned).length;
  document.getElementById('sAdmins').textContent = allUsers.filter(u=>u.is_admin).length;
  renderUsers();
}

function renderUsers(){
  const q = document.getElementById('userSearch').value.trim().toLowerCase();
  const wrap = document.getElementById('adminList');
  const list = allUsers
    .filter(u => !q || u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q))
    .sort((a,b)=>a.username.localeCompare(b.username));

  if(list.length===0){ wrap.innerHTML = '<div class="empty-state">No users match your search.</div>'; return; }

  wrap.innerHTML = '';
  list.forEach(u=>{
    const t = computeTrust(u);
    const row = document.createElement('div');
    row.className = 'admin-row';
    row.innerHTML = `
      <div class="admin-name">
        ${escapeHtml(u.username)} <span class="hint">${escapeHtml(u.email)}</span>
        ${u.is_admin?'<span class="label"> (admin)</span>':''}
        ${u.is_banned?'<span class="banned-tag">Banned</span>':''}
        <div class="badge ${t.level}" style="margin-top:4px;"><i></i>${t.label}</div>
      </div>
      <div class="admin-credit-ctrl">
        <button class="mini-btn" onclick="adjustCredits('${u.id}',-1)">−</button>
        <span class="credit-num" style="font-size:14px;">${u.credits}</span>
        <button class="mini-btn" onclick="adjustCredits('${u.id}',1)">+</button>
        <input type="number" class="amount-input" id="amt_${u.id}" placeholder="±n">
        <button class="rate-btn" onclick="applyCustomAmount('${u.id}')">Apply</button>
      </div>
      <button class="ban-btn ${u.is_banned?'is-banned':''}" ${u.is_admin?'disabled':''} onclick="toggleBan('${u.id}')">
        ${u.is_banned ? 'Reinstate' : 'Ban'}
      </button>
    `;
    wrap.appendChild(row);
  });
}

async function adjustCredits(userId, delta){
  const res = await apiFetch(`/admin/users/${userId}/credits`, { method:'POST', body: JSON.stringify({ delta }) });
  if(!res || !res.ok){ alert(res?.data?.error || 'Something went wrong.'); return; }
  await loadUsers();
}
async function applyCustomAmount(userId){
  const input = document.getElementById('amt_'+userId);
  const val = parseInt(input.value, 10);
  if(!val || isNaN(val)){ input.style.borderColor = 'var(--accent)'; return; }
  await adjustCredits(userId, val);
}
async function toggleBan(userId){
  const res = await apiFetch(`/admin/users/${userId}/ban`, { method:'POST' });
  if(!res || !res.ok){ alert(res?.data?.error || 'Something went wrong.'); return; }
  await loadUsers();
}

async function loadSuggestions(){
  const wrap = document.getElementById('suggestionsList');
  const res = await apiFetch('/admin/suggestions');
  if(!res || !res.ok){ wrap.innerHTML = '<div class="empty-state">Could not load suggestions.</div>'; return; }
  const list = res.data.suggestions || [];
  if(list.length===0){ wrap.innerHTML = '<div class="empty-state">No suggestions yet.</div>'; return; }
  wrap.innerHTML = list.map(s => `
    <div class="fb-item">
      <div class="fb-meta">
        <span>${escapeHtml(s.username)}</span>
        <span class="hint">${escapeHtml(s.email)}</span>
        <span>${new Date(s.created_at).toLocaleDateString()}</span>
      </div>
      ${escapeHtml(s.text)}
      <div class="rate-row">
        <span class="badge ${s.status==='reviewed'?'betrodd':'omtvistad'}"><i></i>${s.status==='reviewed'?'Reviewed':'Open'}</span>
        <button class="rate-btn" onclick="toggleSuggestion('${s.id}')">${s.status==='reviewed'?'Mark as open':'Mark as reviewed'}</button>
      </div>
    </div>
  `).join('');
}
async function toggleSuggestion(id){
  const res = await apiFetch(`/admin/suggestions/${id}/resolve`, { method:'POST' });
  if(!res || !res.ok){ alert(res?.data?.error || 'Something went wrong.'); return; }
  await loadSuggestions();
}

init();
</script>
</body>
</html>
